# Checks every push and pull request to main: types, lint (including the
# Lucide/no-emoji rule) and the unit tests in tests/unit. No database or
# Supabase is needed, so no secrets are used. `next build` is not run here
# because some pages read the database while prerendering.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder only, so `prisma generate` (postinstall) can read the schema. Nothing connects to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
